<template>
    <div class="veleiro-home">
        <div class="veleiro-hero">
            <img src={logoUrl} class="hero-logo" alt="Veleiro" />
            <div class="hero-text">
                <h1>Field Mappings</h1>
                <p>Map any Salesforce object to a Veleiro <strong>client</strong> or <strong>project</strong>.
                   Known combinations (Account → client, Opportunity → project) auto-fill their defaults;
                   anything else you define by hand.</p>
            </div>
            <img src={mascotUrl} class="hero-mascot" alt="Velly" />
        </div>

        <!-- 1) Configuracion de la integracion (definir PRIMERO) -->
        <div class="veleiro-card">
            <div class="veleiro-section-head">1 · How the integration works</div>
            <div class="veleiro-pickers-3">
                <lightning-combobox label="Direction" options={directionOptions}
                    value={syncDirection} onchange={handleDirectionChange}></lightning-combobox>
                <lightning-combobox label="On conflict, who wins" options={winnerOptions}
                    value={syncWinner} onchange={handleWinnerChange}></lightning-combobox>
                <lightning-combobox label="Pull from Veleiro (schedule)" options={frequencyOptions}
                    value={syncFrequency} onchange={handleFrequencyChange}></lightning-combobox>
            </div>
            <div class="veleiro-actions">
                <span class="veleiro-config-hint">🧭&nbsp;Set this first — it defines whether Salesforce pushes, pulls, or both, who wins a conflict, and how often we pull from Veleiro (no webhook yet).</span>
                <lightning-button variant="brand" label="Save configuration" onclick={handleSaveConfig}
                    disabled={savingConfig} class="veleiro-brand-btn"></lightning-button>
            </div>
        </div>

        <!-- 2) Builder de mapeo de campos -->
        <div class="veleiro-card">
            <div class="veleiro-section-head">2 · Field mappings</div>
            <div class="veleiro-pickers">
                <lightning-combobox
                    label="Salesforce object"
                    placeholder="Select an object…"
                    options={objectOptions}
                    value={selectedObject}
                    onchange={handleObjectChange}
                    class="veleiro-picker">
                </lightning-combobox>
                <div class="veleiro-arrow">→</div>
                <lightning-combobox
                    label="Veleiro entity"
                    placeholder="client / project"
                    options={entityOptions}
                    value={selectedEntity}
                    onchange={handleEntityChange}
                    class="veleiro-picker">
                </lightning-combobox>
            </div>

            <template if:true={canEdit}>
                <template if:true={hint}>
                    <div class="veleiro-hint">🧭&nbsp;{hint}</div>
                </template>

                <div class="veleiro-map-table">
                    <div class="veleiro-map-row veleiro-map-header">
                        <span>Salesforce field</span>
                        <span></span>
                        <span>Veleiro target</span>
                        <span>Type</span>
                        <span></span>
                    </div>
                    <template for:each={rows} for:item="row">
                        <div key={row.key} class="veleiro-map-row">
                            <lightning-combobox
                                variant="label-hidden"
                                placeholder="Field…"
                                options={fieldOptions}
                                value={row.sfField}
                                data-key={row.key}
                                onchange={handleFieldChange}>
                            </lightning-combobox>
                            <span class="veleiro-arrow-sm">→</span>
                            <lightning-input
                                variant="label-hidden"
                                placeholder="e.g. name or sf_amount"
                                value={row.target}
                                data-key={row.key}
                                onchange={handleTargetChange}>
                            </lightning-input>
                            <lightning-combobox
                                variant="label-hidden"
                                options={typeOptions}
                                value={row.type}
                                data-key={row.key}
                                onchange={handleTypeChange}>
                            </lightning-combobox>
                            <lightning-button-icon
                                icon-name="utility:delete"
                                variant="bare"
                                alternative-text="Remove"
                                data-key={row.key}
                                onclick={removeRow}>
                            </lightning-button-icon>
                        </div>
                    </template>
                </div>

                <div class="veleiro-actions">
                    <lightning-button label="Add field" icon-name="utility:add" onclick={addRow}></lightning-button>
                    <lightning-button variant="brand" label="Save mapping" onclick={handleSave}
                        disabled={saveDisabled} class="veleiro-brand-btn"></lightning-button>
                </div>
            </template>

            <template if:false={canEdit}>
                <p class="veleiro-empty-hint">Pick an object and a Veleiro entity to start mapping.</p>
            </template>
        </div>

        <!-- Resumen de lo configurado -->
        <template if:true={hasSummary}>
            <div class="veleiro-section-head">Configured mappings</div>
            <template for:each={summary} for:item="g">
                <div key={g.key} class="veleiro-group">
                    <div class="veleiro-group-head">
                        <span class="veleiro-group-name">{g.object}</span>
                        <span class="veleiro-arrow-sm">→</span>
                        <span class="veleiro-badge">{g.entity}</span>
                        <span class="veleiro-group-count">{g.rows.length} field(s)</span>
                    </div>
                    <template for:each={g.rows} for:item="r">
                        <div key={r.key} class="veleiro-sum-row">
                            <code>{r.sfField}</code><span class="veleiro-arrow-sm">→</span><code>{r.target}</code>
                            <span class="veleiro-type">{r.type}</span>
                        </div>
                    </template>
                </div>
            </template>
        </template>
    </div>
</template>

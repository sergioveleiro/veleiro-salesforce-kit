<template>
    <div class="veleiro-home">
        <div class="veleiro-hero">
            <img src={logoUrl} class="hero-logo" alt="Veleiro" />
            <div class="hero-text">
                <h1>Field Mappings</h1>
                <p>Map any Salesforce object to a Veleiro <strong>client</strong> or <strong>project</strong>.
                   Known combinations (Account → client, Opportunity → project) auto-fill their defaults;
                   anything else you define by hand.</p>
            </div>
            <img src={mascotUrl} class="hero-mascot" alt="Velly" />
        </div>

        <!-- 0) Conexion + estado en vivo -->
        <div class="veleiro-card">
            <div class={statusClass}>
                <span class="veleiro-status-dot">{statusDot}</span>
                <div class="veleiro-status-text">
                    <span class="veleiro-status-label">{statusLabel}</span>
                    <span class="veleiro-status-sub">{statusMessage}</span>
                    <template if:true={nextRunText}>
                        <span class="veleiro-status-sub">🕒&nbsp;{nextRunText}</span>
                    </template>
                </div>
                <lightning-button-icon icon-name="utility:refresh" alternative-text="Re-check"
                    title="Re-check connection" onclick={loadStatus} variant="border-filled"></lightning-button-icon>
            </div>
            <div class="veleiro-conn-row">
                <lightning-input type="password" variant="label-hidden" placeholder={tokenPlaceholder}
                    value={tokenInput} onchange={handleTokenChange} class="veleiro-conn-input"></lightning-input>
                <lightning-button variant="brand" label={saveTokenLabel} onclick={handleSaveToken}
                    disabled={checking} class="veleiro-brand-btn"></lightning-button>
            </div>
        </div>

        <!-- 1) Configuracion de la integracion (definir PRIMERO) -->
        <div class="veleiro-card">
            <div class="veleiro-section-head">1 · How the integration works</div>
            <div class="veleiro-pickers-3">
                <lightning-combobox label="Direction" options={directionOptions}
                    value={syncDirection} onchange={handleDirectionChange}></lightning-combobox>
                <lightning-combobox label="On conflict, who wins" options={winnerOptions}
                    value={syncWinner} onchange={handleWinnerChange}></lightning-combobox>
                <lightning-combobox label="Pull from Veleiro (schedule)" options={frequencyOptions}
                    value={syncFrequency} onchange={handleFrequencyChange}></lightning-combobox>
            </div>
            <div class="veleiro-actions">
                <span class="veleiro-config-hint">🧭&nbsp;Set this first — it defines whether Salesforce pushes, pulls, or both, who wins a conflict, and how often we pull from Veleiro (no webhook yet).</span>
                <lightning-button variant="brand" label="Save configuration" onclick={handleSaveConfig}
                    disabled={savingConfig} class="veleiro-brand-btn"></lightning-button>
            </div>
        </div>

        <!-- 2) Field mappings — una sola superficie: LISTA o EDITOR -->
        <div class="veleiro-card">
            <div class="veleiro-section-head-row">
                <span class="veleiro-section-head">2 · Field mappings</span>
                <template if:true={showList}>
                    <lightning-button label="Add mapping" icon-name="utility:add" onclick={startNew}></lightning-button>
                </template>
            </div>

            <!-- EDITOR (crear o editar) -->
            <template if:true={showEditor}>
                <p class="veleiro-editor-title">{editorTitle}</p>
                <div class="veleiro-pickers">
                    <lightning-combobox
                        label="Salesforce object"
                        placeholder="Select an object…"
                        options={objectOptions}
                        value={selectedObject}
                        onchange={handleObjectChange}
                        disabled={objectLocked}
                        class="veleiro-picker">
                    </lightning-combobox>
                    <div class="veleiro-arrow">→</div>
                    <lightning-combobox
                        label="Veleiro entity"
                        placeholder="client / project"
                        options={entityOptions}
                        value={selectedEntity}
                        onchange={handleEntityChange}
                        disabled={entityLocked}
                        class="veleiro-picker">
                    </lightning-combobox>
                </div>
                <template if:true={entityLocked}>
                    <p class="veleiro-locked-hint">🔒&nbsp;One Veleiro entity per Salesforce object — this one is fixed.</p>
                </template>

                <template if:true={canSave}>
                    <template if:true={hint}>
                        <div class="veleiro-hint">🧭&nbsp;{hint}</div>
                    </template>
                    <div class="veleiro-map-table">
                        <div class="veleiro-map-row veleiro-map-header">
                            <span>Salesforce field</span>
                            <span></span>
                            <span>Veleiro target</span>
                            <span></span>
                        </div>
                        <template for:each={displayRows} for:item="row">
                            <div key={row.key} class="veleiro-map-row">
                                <lightning-combobox variant="label-hidden" placeholder="Field…"
                                    options={fieldOptions} value={row.sfField}
                                    data-key={row.key} onchange={handleFieldChange}></lightning-combobox>
                                <span class="veleiro-arrow-sm">→</span>
                                <div class="veleiro-target-cell">
                                    <lightning-combobox variant="label-hidden" placeholder="Pick a Veleiro field…"
                                        options={targetOptions} value={row.comboValue}
                                        data-key={row.key} onchange={handleTargetSelect}></lightning-combobox>
                                    <template if:true={row.isCustom}>
                                        <lightning-input variant="label-hidden" placeholder="custom key (e.g. sf_region)"
                                            value={row.target} data-key={row.key}
                                            onchange={handleCustomTargetChange}></lightning-input>
                                    </template>
                                </div>
                                <lightning-button-icon icon-name="utility:delete" variant="bare"
                                    alternative-text="Remove" data-key={row.key} onclick={removeRow}></lightning-button-icon>
                            </div>
                        </template>
                    </div>
                    <p class="veleiro-target-note">The <strong>Type</strong> (standard vs additional field) and a consistent key are set automatically from the Veleiro target you pick — so the same field lands in the same place across everyone's org.</p>
                    <div class="veleiro-actions">
                        <lightning-button label="Add field" icon-name="utility:add" onclick={addRow}></lightning-button>
                        <div class="veleiro-actions-right">
                            <lightning-button label="Cancel" onclick={cancelEdit} class="slds-m-right_x-small"></lightning-button>
                            <lightning-button variant="brand" label="Save mapping" onclick={handleSave}
                                disabled={saveDisabled} class="veleiro-brand-btn"></lightning-button>
                        </div>
                    </div>
                </template>
            </template>

            <!-- LISTA (mapeos ya configurados) -->
            <template if:true={showList}>
                <template if:true={hasSummary}>
                    <template for:each={summary} for:item="g">
                        <div key={g.key} class="veleiro-group veleiro-group-clickable"
                            data-object={g.object} data-entity={g.entity}
                            onclick={editMapping} role="button" tabindex="0">
                            <div class="veleiro-group-head">
                                <span class="veleiro-group-name">{g.object}</span>
                                <span class="veleiro-arrow-sm">→</span>
                                <span class="veleiro-badge">{g.entity}</span>
                                <span class="veleiro-group-count">{g.rows.length} field(s)</span>
                                <lightning-icon icon-name="utility:edit" size="x-small"
                                    alternative-text="Edit" class="veleiro-edit-icon"></lightning-icon>
                            </div>
                            <template for:each={g.rows} for:item="r">
                                <div key={r.key} class="veleiro-sum-row">
                                    <code>{r.sfField}</code><span class="veleiro-arrow-sm">→</span><code>{r.target}</code>
                                    <span class="veleiro-type">{r.type}</span>
                                </div>
                            </template>
                        </div>
                    </template>
                </template>
                <template if:true={showEmpty}>
                    <div class="veleiro-empty-map">
                        <p>No field mappings yet.</p>
                        <lightning-button variant="brand" label="Add your first mapping" icon-name="utility:add"
                            onclick={startNew} class="veleiro-brand-btn"></lightning-button>
                    </div>
                </template>
            </template>
        </div>
    </div>
</template>

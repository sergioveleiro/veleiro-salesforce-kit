<template>
    <lightning-card>
        <div slot="title" class="veleiro-title">
            <img src={logoUrl} alt="Veleiro" class="veleiro-logo" />
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <div class="veleiro-accentbar"></div>

            <template if:true={loading}>
                <lightning-spinner alternative-text="Working..." size="small"></lightning-spinner>
            </template>

            <!-- Sincronizado -->
            <template if:true={synced}>
                <p class="slds-text-body_small slds-m-bottom_small veleiro-ok">
                    &#9679;&nbsp;Synced with Veleiro
                </p>
                <div class="veleiro-row"><span class="veleiro-label">Client</span><span class="veleiro-value">{summary.name}</span></div>
                <div class="veleiro-row"><span class="veleiro-label">Client ID</span><span class="veleiro-value">{summary.clientId}</span></div>
                <div class="veleiro-row"><span class="veleiro-label">Version</span><span class="veleiro-value">{summary.version}</span></div>

                <div class="slds-m-top_medium">
                    <a href={summary.veleiroUrl} target="_blank" rel="noopener" class="veleiro-link">
                        Open in Veleiro &#8599;
                    </a>
                    <lightning-button label="Re-sync" onclick={handleSync} class="slds-m-left_small veleiro-brand-btn"></lightning-button>
                </div>
            </template>

            <!-- No sincronizado -->
            <template if:false={synced}>
                <div class="veleiro-empty">
                    <img src={mascotUrl} alt="Velly" class="veleiro-mascot" />
                    <p class="slds-text-body_regular slds-text-color_weak">
                        This account isn't linked to Veleiro yet.
                    </p>
                </div>
                <lightning-button variant="brand" label="Sync with Veleiro" onclick={handleSync} class="veleiro-brand-btn"></lightning-button>
            </template>

            <!-- Este cliente podria existir ya en Veleiro: vincular en vez de duplicar -->
            <template if:true={showCandidates}>
                <section role="dialog" aria-modal="true" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <header class="slds-modal__header">
                            <h2 class="slds-text-heading_medium">This account may already exist in Veleiro</h2>
                        </header>
                        <div class="slds-modal__content slds-p-around_medium">
                            <p class="slds-text-body_small slds-m-bottom_small slds-text-color_weak">
                                Link it instead of creating a second client.
                            </p>
                            <template for:each={candidates} for:item="c">
                                <div key={c.clientId} class="veleiro-candidate slds-m-bottom_x-small">
                                    <div>
                                        <a href={c.veleiroUrl} target="_blank" rel="noopener" class="veleiro-link">{c.name}</a>
                                        <p class="slds-text-body_small slds-text-color_weak">{c.reason}</p>
                                        <template if:true={c.linkedToOtherAccount}>
                                            <p class="slds-text-body_small veleiro-warn">
                                                Already linked to another Salesforce account
                                            </p>
                                        </template>
                                    </div>
                                    <lightning-button label="Link" data-id={c.clientId} onclick={handleLink}></lightning-button>
                                </div>
                            </template>
                        </div>
                        <footer class="slds-modal__footer">
                            <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
                            <lightning-button label="Create a new client anyway" onclick={handleCreateAnyway}
                                class="slds-m-left_x-small"></lightning-button>
                        </footer>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
        </div>
    </lightning-card>
</template>

<template>
    <lightning-card>
        <div slot="title" class="veleiro-title">
            <img src={logoUrl} alt="Veleiro" class="veleiro-logo" />
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <div class="veleiro-accentbar"></div>

            <h2 class="slds-text-heading_small">Link existing records</h2>
            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                Every Veleiro client that isn't linked yet, with the Salesforce accounts that look
                like it. Pick one per client, or search by name, then link.
            </p>

            <template if:true={loading}>
                <lightning-spinner alternative-text="Reading Veleiro..." size="small"></lightning-spinner>
            </template>

            <template if:true={overview}>
                <div class="veleiro-stats slds-m-bottom_medium">
                    <div class="veleiro-stat">
                        <span class="veleiro-stat-num">{overview.clientsUnlinked}</span>
                        <span class="veleiro-stat-label">Veleiro clients to link</span>
                    </div>
                    <div class="veleiro-stat">
                        <span class="veleiro-stat-num">{overview.accountsUnlinked}</span>
                        <span class="veleiro-stat-label">accounts not linked</span>
                    </div>
                    <div class="veleiro-stat">
                        <span class="veleiro-stat-num">{overview.accountsLinked}</span>
                        <span class="veleiro-stat-label">already linked</span>
                    </div>
                </div>
            </template>

            <template if:true={hasRows}>
                <div class="veleiro-toolbar slds-m-bottom_small">
                    <lightning-input type="checkbox" label="Only clients with a suggestion"
                        checked={onlySuggested} onchange={handleToggleFilter}></lightning-input>
                    <div>
                        <lightning-button label="Clear" onclick={handleClear}></lightning-button>
                        <lightning-button variant="brand" label={linkLabel} disabled={nothingToLink}
                            onclick={handleLink} class="slds-m-left_x-small veleiro-brand-btn"></lightning-button>
                    </div>
                </div>

                <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col"><div class="slds-truncate">Veleiro client</div></th>
                            <th scope="col"><div class="slds-truncate">Salesforce account</div></th>
                            <th scope="col"><div class="slds-truncate">Search by name</div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={visibleRows} for:item="r">
                            <tr key={r.clientId}>
                                <td>
                                    <a href={r.veleiroUrl} target="_blank" rel="noopener" class="veleiro-link">
                                        {r.clientName}
                                    </a>
                                    <div class="slds-text-body_small slds-text-color_weak">{r.clientWebsite}</div>
                                </td>
                                <td>
                                    <lightning-combobox variant="label-hidden" label="Account"
                                        data-client={r.clientId} value={r.selectedAccountId}
                                        options={r.options} onchange={handleSelect}></lightning-combobox>
                                    <div class="slds-text-body_small slds-text-color_weak">{r.note}</div>
                                </td>
                                <td>
                                    <lightning-input type="search" variant="label-hidden" label="Search"
                                        placeholder="Account name…" data-client={r.clientId}
                                        onchange={handleSearch}></lightning-input>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <template if:false={hasRows}>
                <template if:true={scanned}>
                    <p class="slds-text-body_regular slds-text-color_weak">{emptyMessage}</p>
                </template>
            </template>

            <div class="slds-m-top_medium">
                <lightning-button label="Re-scan" onclick={scan}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>

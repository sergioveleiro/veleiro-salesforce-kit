<template>
    <lightning-card>
        <div slot="title" class="veleiro-title">
            <img src={logoUrl} alt="Veleiro" class="veleiro-logo" />
        </div>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <div class="veleiro-accentbar"></div>

            <h2 class="slds-text-heading_small">Link existing records</h2>
            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                For records that already existed on both sides. The pairs come from Veleiro Mappings:
                each Veleiro record shows the Salesforce record we think it is — keep it, or type to
                pick another.
            </p>

            <template if:true={loading}>
                <lightning-spinner alternative-text="Reading Veleiro..." size="small"></lightning-spinner>
            </template>

            <template if:true={hasPairs}>
                <div class="veleiro-pair slds-m-bottom_medium">
                    <lightning-combobox label="Mapping" value={pairValue} options={pairOptions}
                        onchange={handlePairChange}></lightning-combobox>
                </div>

                <div class="veleiro-stats slds-m-bottom_medium">
                    <div class="veleiro-stat">
                        <span class="veleiro-stat-num">{overview.veleiroUnlinked}</span>
                        <span class="veleiro-stat-label">{veleiroColumnLabel}s to link</span>
                    </div>
                    <div class="veleiro-stat">
                        <span class="veleiro-stat-num">{overview.recordsUnlinked}</span>
                        <span class="veleiro-stat-label">{recordColumnLabel} records not linked</span>
                    </div>
                    <div class="veleiro-stat">
                        <span class="veleiro-stat-num">{overview.alreadyLinked}</span>
                        <span class="veleiro-stat-label">already linked</span>
                    </div>
                </div>
            </template>

            <template if:true={hasRows}>
                <div class="veleiro-toolbar slds-m-bottom_small">
                    <lightning-input type="checkbox" label="Only rows with a suggestion"
                        checked={onlySuggested} onchange={handleToggleFilter}></lightning-input>
                    <div>
                        <lightning-button label="Clear" onclick={handleClear}></lightning-button>
                        <lightning-button label={linkLabel} disabled={nothingToLink} onclick={handleLink}
                            class="slds-m-left_x-small"
                            title="Only writes the link. Mapped fields stay in Salesforce."></lightning-button>
                        <lightning-button variant="brand" label={linkAndSyncLabel} disabled={nothingToLink}
                            onclick={handleLinkAndSync} class="slds-m-left_x-small veleiro-brand-btn"
                            title="Links and sends the mapped fields to Veleiro."></lightning-button>
                    </div>
                </div>

                <table class="slds-table slds-table_bordered slds-table_cell-buffer">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col"><div class="slds-truncate">{veleiroColumnLabel}</div></th>
                            <th scope="col"><div class="slds-truncate">{recordColumnLabel}</div></th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={visibleRows} for:item="r">
                            <tr key={r.veleiroId}>
                                <td class="veleiro-client-cell">
                                    <a href={r.veleiroUrl} target="_blank" rel="noopener" class="veleiro-link">
                                        {r.veleiroName}
                                    </a>
                                    <div class="slds-text-body_small slds-text-color_weak">{r.veleiroWebsite}</div>
                                </td>
                                <td>
                                    <!-- Buscador propio: escribe y elige; sin dependencias de configuracion. -->
                                    <template if:true={r.chosen}>
                                        <div class="veleiro-chosen">
                                            <span class="veleiro-ok">{r.chosenName}</span>
                                            <button type="button" class="veleiro-chip" data-veleiro={r.veleiroId}
                                                onclick={handleUnpick}>change</button>
                                        </div>
                                        <div class="slds-text-body_small slds-text-color_weak">{r.note}</div>
                                    </template>

                                    <template if:false={r.chosen}>
                                        <lightning-input type="search" variant="label-hidden" label="Search"
                                            placeholder="Type a name…" value={r.term} data-veleiro={r.veleiroId}
                                            onchange={handleSearch}></lightning-input>
                                        <div class="slds-text-body_small slds-text-color_weak slds-m-top_xxx-small">
                                            {r.note}
                                        </div>
                                    </template>

                                    <template if:true={r.hasAlternatives}>
                                        <div class="veleiro-suggestions">
                                            <template for:each={r.alternatives} for:item="alt">
                                                <button key={alt.recordId} type="button"
                                                    class="veleiro-chip" data-veleiro={r.veleiroId}
                                                    data-record={alt.recordId} onclick={handleUseSuggestion}>
                                                    {alt.name} · {alt.reason}
                                                </button>
                                            </template>
                                        </div>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>

            <template if:false={hasRows}>
                <template if:true={scanned}>
                    <p class="slds-text-body_regular slds-text-color_weak">{emptyMessage}</p>
                </template>
            </template>

            <div class="slds-m-top_medium">
                <lightning-button label="Re-scan" onclick={scan}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>

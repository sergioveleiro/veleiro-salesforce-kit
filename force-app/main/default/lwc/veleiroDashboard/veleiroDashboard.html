<template>
    <div class="veleiro-dash">
        <!-- Encabezado: una sola línea de título, los KPIs van juntos abajo -->
        <div class="veleiro-head">
            <div>
                <h1 class="veleiro-h1">{labels.dashTitle}</h1>
                <p class="veleiro-sub">{labels.dashSub}</p>
            </div>
            <lightning-button-icon icon-name="utility:refresh" alternative-text={labels.refresh}
                title={labels.refresh} variant="border-filled" onclick={handleRefresh}
                class="veleiro-refresh"></lightning-button-icon>
        </div>

        <template if:true={loading}>
            <div class="veleiro-loading">
                <lightning-spinner alternative-text={labels.loading} size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={error}>
            <div class="veleiro-error">{error}</div>
        </template>

        <!-- KPIs: una sola pieza, no cinco tarjetas sueltas -->
        <template if:true={overview}>
            <div class="veleiro-kpis">
                <div class="veleiro-kpi">
                    <span class="veleiro-kpi-num">{overview.clientCount}</span>
                    <span class="veleiro-kpi-lbl">{labels.kpiClients}</span>
                </div>
                <div class="veleiro-kpi">
                    <span class="veleiro-kpi-num">{overview.projectCount}</span>
                    <span class="veleiro-kpi-lbl">{labels.kpiProjects}</span>
                </div>
                <div class="veleiro-kpi">
                    <span class="veleiro-kpi-num">{overview.openProjectCount}</span>
                    <span class="veleiro-kpi-lbl">{labels.kpiOpen}</span>
                </div>
                <div class="veleiro-kpi">
                    <span class="veleiro-kpi-num">{overview.completedProjectCount}</span>
                    <span class="veleiro-kpi-lbl">{labels.kpiCompleted}</span>
                </div>
                <div class="veleiro-kpi veleiro-kpi-accent">
                    <span class="veleiro-kpi-num">{overview.avgProgress}%</span>
                    <span class="veleiro-kpi-lbl">{labels.kpiAvg}</span>
                </div>
            </div>
        </template>

        <!-- Vacío -->
        <template if:true={isEmpty}>
            <div class="veleiro-empty">
                <img src={mascotUrl} alt="Velly" class="veleiro-mascot-lg" />
                <p>{labels.dashEmpty}</p>
            </div>
        </template>

        <!-- Clients -->
        <template if:true={hasClients}>
            <div class="veleiro-toolbar">
                <span class="veleiro-toolbar-count">{countLabel}</span>
                <div class="veleiro-toolbar-controls">
                    <lightning-input type="search" variant="label-hidden" placeholder={labels.findClient}
                        value={search} onchange={handleSearch} oninput={handleSearch}
                        class="veleiro-toolbar-search"></lightning-input>
                    <lightning-combobox variant="label-hidden" options={sortOptions} value={sortBy}
                        onchange={handleSort} class="veleiro-toolbar-sort"></lightning-combobox>
                </div>
            </div>

            <template if:true={noMatches}>
                <p class="veleiro-nomatch">{noMatchesLine}</p>
            </template>

            <div class={listClass}>
                <template for:each={clients} for:item="c">
                    <div key={c.id} class={c.cardClass}>
                        <!-- Fila compacta: todo lo que importa de un client en un renglón -->
                        <div class="veleiro-client-head" data-id={c.id} onclick={handleToggle}
                            role="button" tabindex="0">
                            <lightning-icon icon-name={c.iconName} size="xx-small"
                                class="veleiro-chev"></lightning-icon>
                            <span class="veleiro-client-name">{c.name}</span>
                            <span class="veleiro-badge">{c.projectCount}</span>
                            <div class="veleiro-spacer"></div>
                            <div class={c.trackClass}>
                                <div class="veleiro-mini-fill" data-pct={c.avgProgress}></div>
                            </div>
                            <span class="veleiro-avg-pct">{c.avgProgress}%</span>
                        </div>

                        <!-- Cuerpo colapsable -->
                        <div class={c.bodyClass}>
                            <div class="veleiro-proj-head">
                                <span class="veleiro-proj-count">{c.countLabel}</span>
                                <a href={c.url} target="_blank" rel="noopener" class="veleiro-openlink">
                                    {labels.openClientInVeleiro} &#8599;
                                </a>
                            </div>
                            <template for:each={c.projects} for:item="p">
                                <div key={p.id} class="veleiro-proj">
                                    <div class="veleiro-proj-row">
                                        <a href={p.url} target="_blank" rel="noopener"
                                            class="veleiro-proj-name">{p.name}</a>
                                        <span class="veleiro-proj-meta">
                                            <span class="veleiro-proj-status">{p.status}</span>
                                            <span class="veleiro-proj-pct">{p.progressLabel}</span>
                                        </span>
                                    </div>
                                    <lightning-progress-bar value={p.progress} size="small"
                                        variant={p.barVariant} class={p.barClass}></lightning-progress-bar>
                                </div>
                            </template>
                            <template if:true={c.hasHiddenProjects}>
                                <a href={c.url} target="_blank" rel="noopener" class="veleiro-openlink">
                                    {c.hiddenProjects} &#8599;
                                </a>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <template if:true={hasMore}>
                <button class="veleiro-showall" onclick={handleShowAll}>{showAllLabel}</button>
            </template>
            <template if:true={canCollapse}>
                <button class="veleiro-showall" onclick={handleShowAll}>{showAllLabel}</button>
            </template>
        </template>
    </div>
</template>
